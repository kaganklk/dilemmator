<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İletişim — Dilemmator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #07070F;
  color: #F3F1EC;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  line-height: 1.7;
}

.topbar {
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 20px 40px;
  display: flex;
  align-items: center;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 0.06em;
  text-decoration: none;
}

.logo-w { color: #F3F1EC; }
.logo-r { color: #FF2D55; }

.back-link {
  margin-left: auto;
  font-size: 12px;
  color: #666680;
  text-decoration: none;
  letter-spacing: 0.05em;
  transition: color 0.2s;
}

.back-link:hover { color: #FF2D55; }

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 60px 24px 80px;
}

.page-label {
  font-size: 11px;
  font-weight: 600;
  color: #FF2D55;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.page-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px;
  letter-spacing: 0.05em;
  color: #F3F1EC;
  line-height: 1;
  margin-bottom: 12px;
}

.page-sub {
  font-size: 14px;
  font-weight: 300;
  color: #666680;
  margin-bottom: 48px;
}

.divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 40px 0;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 40px;
}

.contact-card {
  background: #131320;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 24px;
  text-decoration: none;
  transition: border-color 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact-card:hover {
  border-color: rgba(255,45,85,0.3);
}

.card-icon {
  width: 36px;
  height: 36px;
  background: rgba(255,45,85,0.1);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-icon svg {
  width: 18px;
  height: 18px;
  stroke: #FF2D55;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.card-label {
  font-size: 10px;
  font-weight: 600;
  color: #666680;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.card-value {
  font-size: 14px;
  font-weight: 500;
  color: #F3F1EC;
}

.card-desc {
  font-size: 12px;
  color: #666680;
  font-weight: 300;
}

.form-section h2 {
  font-size: 13px;
  font-weight: 600;
  color: #F3F1EC;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding-left: 12px;
  border-left: 2px solid #FF2D55;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 10px;
  font-weight: 600;
  color: #666680;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.field input,
.field textarea {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 11px;
  padding: 13px 15px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #F3F1EC;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
  width: 100%;
}

.field input::placeholder,
.field textarea::placeholder {
  color: #666680;
}

.field input:focus,
.field textarea:focus {
  border-color: rgba(255,45,85,0.35);
}

.field textarea {
  height: 120px;
}

.btn-submit {
  width: 100%;
  padding: 15px;
  background: #FF2D55;
  color: #fff;
  border: none;
  border-radius: 11px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.12s;
  margin-top: 4px;
}

.btn-submit:hover { opacity: 0.9; }
.btn-submit:active { transform: scale(0.977); }

.success-msg {
  display: none;
  background: rgba(29, 158, 117, 0.1);
  border: 1px solid rgba(29, 158, 117, 0.25);
  border-radius: 11px;
  padding: 14px 16px;
  font-size: 13px;
  color: #1D9E75;
  text-align: center;
  margin-top: 4px;
}

.social-section {
  margin-top: 40px;
}

.social-section h2 {
  font-size: 13px;
  font-weight: 600;
  color: #F3F1EC;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 2px solid #FF2D55;
}

.social-links {
  display: flex;
  gap: 12px;
}

.social-link {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #131320;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 11px;
  padding: 12px 18px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  color: #8888AA;
  transition: all 0.2s;
}

.social-link:hover {
  color: #F3F1EC;
  border-color: rgba(255,45,85,0.3);
}

.social-link svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  flex-shrink: 0;
}

footer {
  text-align: center;
  padding: 32px 24px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 11px;
  color: rgba(102,102,128,0.5);
  letter-spacing: 0.05em;
}

@media (max-width: 480px) {
  .contact-grid { grid-template-columns: 1fr; }
  .social-links { flex-direction: column; }
  .topbar { padding: 16px 20px; }
  .page-heading { font-size: 42px; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">
    <span class="logo-w">DILEMMA</span><span class="logo-r">TOR</span>
  </a>
  <a href="/" class="back-link">← Ana Sayfaya Dön</a>
</div>

<div class="container">

  <div class="page-label">Bize Ulaş</div>
  <div class="page-heading">İletişim</div>
  <p class="page-sub">Soru, öneri veya iş birliği için bize yaz.</p>

  <a href="mailto:iletisim@dilemmator.fun" style="display:inline-block; font-size:14px; color:#FF2D55; text-decoration:none; margin-bottom:40px; font-weight:500; letter-spacing:0.02em;">iletisim@dilemmator.fun</a>

  <div class="divider"></div>

  <div class="form-section">
    <h2>Mesaj Gönder</h2>
    <div class="form" id="contact-form">
      <div class="field">
        <div class="field-label">İsmin</div>
        <input type="text" id="name" placeholder="Adın veya takma adın" maxlength="50">
      </div>
      <div class="field">
        <div class="field-label">E-posta</div>
        <input type="email" id="email" placeholder="ornek@mail.com">
      </div>
      <div class="field">
        <div class="field-label">Konu</div>
        <input type="text" id="subject" placeholder="Ne hakkında yazıyorsun?" maxlength="100">
      </div>
      <div class="field">
        <div class="field-label">Mesajın</div>
        <textarea id="message" placeholder="Düşüncelerini, önerilerini veya sorularını yaz..."></textarea>
      </div>
      <button class="btn-submit" onclick="handleSubmit()">Gönder</button>
      <div class="success-msg" id="success-msg">Mesajın alındı, en kısa sürede geri döneceğiz.</div>
    </div>
  </div>


</div>

<footer>
  Dilemmator &mdash; Her seçimin bir bedeli var. &nbsp;·&nbsp; <a href="/gizlilik" style="color: inherit; text-decoration: none;">Gizlilik Politikası</a>
</footer>

<script>
async function handleSubmit() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();

  if (!name || !email || !message) {
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(el => {
      if (!el.value.trim()) {
        el.style.borderColor = 'rgba(255,45,85,0.5)';
        setTimeout(() => { el.style.borderColor = ''; }, 2000);
      }
    });
    return;
  }

  const title = document.getElementById('subject').value.trim() || 'Dilemmator İletişim Formu';

  const btn = document.querySelector('.btn-submit');
  const msgBox = document.getElementById('success-msg');
  
  btn.disabled = true;
  btn.style.opacity = '0.5';
  btn.textContent = 'Gönderiliyor...';
  msgBox.style.display = 'none';

  try {
    await emailjs.send(
      "service_9y9wo2l", 
      "template_y6e3ojq", 
      { name, email, title, message }, 
      "CYOTY6EEiNdDz2yWk"
    );
    msgBox.style.color = '#1D9E75';
    msgBox.style.background = 'rgba(29, 158, 117, 0.1)';
    msgBox.style.borderColor = 'rgba(29, 158, 117, 0.25)';
    msgBox.textContent = 'Mesajın alındı, en kısa sürede geri döneceğiz.';
    msgBox.style.display = 'block';
    btn.textContent = 'Gönderildi';
  } catch (error) {
    console.error("EmailJS Hatası:", error);
    msgBox.style.color = '#FF2D55';
    msgBox.style.background = 'rgba(255, 45, 85, 0.1)';
    msgBox.style.borderColor = 'rgba(255, 45, 85, 0.25)';
    msgBox.textContent = 'Bir hata oluştu, lütfen tekrar dene.';
    msgBox.style.display = 'block';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.textContent = 'Gönder';
  }
}
</script>

</body>
</html>
